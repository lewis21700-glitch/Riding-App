name: mobile
description: "RideApp Cambodia passenger and driver mobile application"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  shared_preferences: ^2.3.5
  geolocator: ^14.1.1
  geolocator_android: ^5.1.1
  flutter_map: ^8.3.2
  latlong2: ^0.9.1
  flutter_secure_storage: ^10.0.0
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
